<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AMU KI-Server</title>
<style>body{font:16px system-ui;background:#101824;color:#e3edf7;max-width:1100px;margin:40px auto;padding:20px}section{background:#1b293b;padding:24px;margin:16px 0;border-radius:12px}input,button{font:inherit;padding:10px;margin:5px;background:#263c55;color:white;border:1px solid #526e89;border-radius:6px}input{min-width:260px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#80ceff}label{display:block}</style>
<h1>AMU zentraler KI/API-Server</h1><p>Lokale Modelle · getrennte Client-Zugänge · OpenAI REST und Streaming</p><a href="/">Bestehende AMU-Oberfläche</a>
<section><label>Administrator-Schlüssel <input id="key" type="password" autocomplete="off"></label><button id="refresh">Status laden</button><p>Der Schlüssel bleibt nur im Arbeitsspeicher dieser Seite.</p></section>
<section><h2>Lokale Modellverbindung</h2><input id="upstream" value="http://127.0.0.1:11434/v1" aria-label="API URL"><input id="model" placeholder="Installierter Modellname"><button id="save">Verbindung speichern</button><button id="models">Modelle abrufen</button><pre id="modelList"></pre></section>
<section><h2>Client-Zugänge</h2><input id="name" placeholder="z. B. AMU-Agent-3"><input id="allowed" placeholder="Erlaubte Modelle, Komma; leer = alle"><button id="create">Client erstellen</button><pre id="newKey"></pre><div id="clients"></div></section>
<section><h2>Status, Ressourcen und Ereignisse</h2><pre id="status">Noch nicht geladen</pre></section><p id="message" role="status"></p>
<script>
const el=id=>document.getElementById(id);
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+el('key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error?.message||r.status);return data;}
async function refresh(){const s=await api('/api/central/status');el('status').textContent=JSON.stringify(s,null,2);el('upstream').value=s.connection.upstream;el('model').value=s.connection.model;el('clients').replaceChildren();s.clients.forEach(c=>{const p=document.createElement('p');p.textContent=c.name+' — '+(c.enabled?'aktiv':'gesperrt')+' ';if(!c.admin&&c.enabled){const b=document.createElement('button');b.textContent='Sperren';b.onclick=()=>run(async()=>{await api('/api/central/revoke',{id:c.id});await refresh()});p.append(b)}el('clients').append(p)});}
async function run(fn){try{await fn();el('message').textContent='Erfolgreich'}catch(e){el('message').textContent=e.message}}
el('refresh').onclick=()=>run(refresh);el('save').onclick=()=>run(()=>api('/api/central/connection',{upstream:el('upstream').value,model:el('model').value}));el('models').onclick=()=>run(async()=>el('modelList').textContent=JSON.stringify(await api('/v1/models'),null,2));el('create').onclick=()=>run(async()=>{const c=await api('/api/central/clients',{name:el('name').value,models:el('allowed').value.split(',').map(s=>s.trim()).filter(Boolean)});el('newKey').textContent='Einmaliger Client-Schlüssel: '+c.key;await refresh()});
</script></html>
